services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: footlog
      POSTGRES_USER: footlog
      POSTGRES_PASSWORD: footlog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footlog"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
